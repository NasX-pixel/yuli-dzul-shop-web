</style></head><body><aside class="season-banner" data-season-banner hidden><i class="season-mark" data-season-mark aria-hidden="true"></i><span data-season-label></span></aside><main class="form-shell"><header><span class="form-brand">Yuli Dzul Shop</span><p class="form-sub">Solicitud de artículos · WhatsApp y Facebook</p></header><div id="formHost"></div><footer><a class="store-location" href="https://maps.app.goo.gl/ts1PmMdhuPrf8S5FA?g_st=ac" target="_blank" rel="noopener noreferrer">Ubicación de la tienda · Cómo llegar</a><span id="webVisits" class="web-visits" title="Visitas aproximadas; una por navegador y día. No equivale a personas únicas.">Visitas: —</span><small>Tus datos se usan para atender tu pedido. Aquí no se realizan cobros.</small></footer></main><script>(()=>{
const SUPABASE_URL='https://xrhbtkwwmfdhisuiexpf.supabase.co';

 function apply(theme){if(!Object.hasOwn(themes,theme))return;root.dataset.season=theme;document.querySelectorAll('[data-season-banner]').forEach(el=>{el.hidden=theme==='normal';el.querySelector('[data-season-label]').textContent=themes[theme][0];el.querySelector('[data-season-mark]').textContent=themes[theme][1];});try{localStorage.setItem('yuli-web-theme-v1',theme);}catch{}const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=getComputedStyle(root).getPropertyValue('--heading').trim()||'#7c3a1e';}
